services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      # Uncomment and adapt these values to enable Keycloak via OIDC.
      # - 'ENABLE_OAUTH_SIGNUP=true'
      # - 'OAUTH_PROVIDER_NAME=Keycloak'
      # - 'OAUTH_CLIENT_ID=open-webui'
      # - 'OAUTH_CLIENT_SECRET=replace-me'
      # - 'OPENID_PROVIDER_URL=https://keycloak.example.com/realms/<realm>/.well-known/openid-configuration'
      # - 'OPENID_REDIRECT_URI=https://open-webui.example.com/oauth/oidc/callback'
      # - 'OAUTH_TOKEN_ENDPOINT_AUTH_METHOD=client_secret_post'
      # - 'OAUTH_USERNAME_CLAIM=preferred_username'
      # - 'OAUTH_EMAIL_CLAIM=email'
      # - 'ENABLE_OAUTH_ROLE_MANAGEMENT=true'
      # - 'OAUTH_ROLES_CLAIM=realm_access.roles'
      # - 'OAUTH_ALLOWED_ROLES=user,admin'
      # - 'OAUTH_ADMIN_ROLES=admin'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
